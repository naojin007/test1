<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Chain Wallet Activity Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .input-section button:active {
            transform: translateY(0);
        }

        .input-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            display: none;
            margin: 40px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .wallet-info {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: none;
        }

        .wallet-info h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .wallet-address {
            word-break: break-all;
            font-family: monospace;
            color: #666;
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }

        .activities {
            display: none;
        }

        .activities h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .activity-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .activity-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .activity-type.sent {
            background: #e74c3c;
        }

        .activity-type.received {
            background: #27ae60;
        }

        .activity-type.contract {
            background: #f39c12;
        }

        .activity-hash {
            font-family: monospace;
            color: #667eea;
            font-size: 12px;
            word-break: break-all;
            margin: 10px 0;
        }

        .activity-hash a {
            color: #667eea;
            text-decoration: none;
        }

        .activity-hash a:hover {
            text-decoration: underline;
        }

        .activity-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .activity-detail {
            display: flex;
            flex-direction: column;
        }

        .activity-detail-label {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .activity-detail-value {
            color: #333;
            font-weight: 500;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Base Chain Wallet Activity</h1>
            <p>ウォレットアドレスを入力してアクティビティを確認</p>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="walletInput" 
                placeholder="0x... (ウォレットアドレスを入力)"
            >
            <button id="searchBtn">検索</button>
        </div>

        <div class="error" id="error"></div>
        <div class="success-message" id="successMsg"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>データを取得中...</p>
        </div>

        <div class="wallet-info" id="walletInfo">
            <h3>ウォレット情報</h3>
            <div class="wallet-address" id="walletAddress"></div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="activities" id="activities">
            <h3>トランザクション履歴</h3>
            <div class="activity-list" id="activityList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
